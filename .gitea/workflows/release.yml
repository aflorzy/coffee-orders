name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Changelog
        id: changelog
        run: |
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            CHANGELOG=$(git log --oneline "$PREV_TAG"..HEAD --no-merges --pretty=format:"- %s")
          else
            CHANGELOG=$(git log --oneline --no-merges --pretty=format:"- %s")
          fi
          {
            echo "body<<EOF"
            echo "$CHANGELOG"
            echo "EOF"
          } >> $GITHUB_OUTPUT

      - name: Create Gitea Release
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST \
            "${{ github.server_url }}/api/v1/repos/${{ github.repository }}/releases" \
            -H "Authorization: token ${{ secrets.RELEASE_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d "$(jq -n \
              --arg tag "${{ github.ref_name }}" \
              --arg name "${{ github.ref_name }}" \
              --arg body "${{ steps.changelog.outputs.body }}" \
              '{tag_name: $tag, name: $name, body: $body, draft: false, prerelease: false}')")
          HTTP_STATUS=$(echo "$RESPONSE" | tail -1)
          BODY=$(echo "$RESPONSE" | head -n -1)
          echo "$BODY"
          if [ "$HTTP_STATUS" -eq 409 ]; then
            echo "Release already exists, skipping creation."
          elif [ "$HTTP_STATUS" -lt 200 ] || [ "$HTTP_STATUS" -ge 300 ]; then
            echo "Release creation failed with HTTP $HTTP_STATUS"
            exit 1
          fi
