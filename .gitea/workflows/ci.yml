name: CI - Build and Push Docker Images

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate_pr:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "20"}
      - id: cache-node-modules-pr
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-modules-
      - if: steps.cache-node-modules-pr.outputs.cache-hit != 'true'
        run: npm ci
      - run: npm run lint --if-present
      - run: npm run build

  build_and_push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: {contents: read, packages: write}
    steps:
      - uses: actions/checkout@v4
      - id: vars
        run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ vars.REGISTRY_URL }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ vars.REGISTRY_URL }}/${{ github.repository }}/coffee-orders:latest
            ${{ vars.REGISTRY_URL }}/${{ github.repository }}/coffee-orders:${{ steps.vars.outputs.sha_short }}.${{ github.run_number }}
          cache-from: type=registry,ref=${{ vars.REGISTRY_URL }}/${{ github.repository }}/coffee-orders:buildcache
          cache-to: type=registry,ref=${{ vars.REGISTRY_URL }}/${{ github.repository }}/coffee-orders:buildcache,mode=max

  deploy_prd:
    needs: build_and_push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - run: |
          BODY="{}"
          SIGNATURE=$(echo -n "$BODY" | openssl dgst -sha256 -hmac "${{ secrets.WEBHOOK_SECRET }}" | sed 's/^.* //')
          curl -X POST \
            -H "Content-Type: application/json" \
            -H "X-Gitea-Signature: $SIGNATURE" \
            -d "$BODY" \
            "${{ secrets.DEPLOY_SERVER_URL }}/webhook/prd"
